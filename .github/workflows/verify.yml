name: Verify mini project

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate package structure
        run: python tests/verify.py
      - name: Test widget event handling
        run: node --test tests/widget.test.cjs